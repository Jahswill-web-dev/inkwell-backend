name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  # Never interrupt a running production migration/deployment with a newer push.
  cancel-in-progress: false

jobs:
  checks:
    name: Tests and Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inkwell_test
          POSTGRES_USER: inkwell_test
          POSTGRES_PASSWORD: inkwell_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U inkwell_test -d inkwell_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://inkwell_test:inkwell_test@localhost:5433/inkwell_test
      TEST_DATABASE_URL: postgresql+psycopg://inkwell_test:inkwell_test@localhost:5433/inkwell_test
      JWT_SECRET_KEY: ci-only-secret-key-not-used-outside-test-runs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run --no-sync ruff check app
      - name: Run tests against isolated PostgreSQL
        # Provider smoke tests require real API credentials and are separate from CI.
        run: uv run --no-sync pytest -m "not openrouter and not vertex" --no-cov
      - name: Build production Docker image
        run: docker build --tag inkwell-backend:ci .

  deploy:
    name: Deploy to Oracle
    needs: checks
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.ORACLE_DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure dedicated deployment key
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$ORACLE_SSH_KEY" ]]; then
            echo '::error::Set the ORACLE_SSH_KEY repository secret before enabling deployment.'
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          umask 077
          # Windows clipboard text may contain CRLF; OpenSSH expects LF here.
          printf '%s\n' "$ORACLE_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/oracle_actions"
          ssh-keygen -y -f "$HOME/.ssh/oracle_actions" > /dev/null
      - name: Deploy the exact tested commit
        env:
          ORACLE_HOST: 144.24.170.81
        run: |
          set -euo pipefail
          git archive --format=tar "$GITHUB_SHA" | ssh -T \
            -i "$HOME/.ssh/oracle_actions" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=deploy/oracle_known_hosts \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "ubuntu@$ORACLE_HOST" "deploy $GITHUB_SHA"
      - name: Check public HTTPS readiness
        run: >-
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors
          --connect-timeout 10 --max-time 30
          https://144-24-170-81.sslip.io/ready
      - name: Remove temporary deployment key
        if: always()
        run: rm -f "$HOME/.ssh/oracle_actions"
