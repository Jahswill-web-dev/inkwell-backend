[project]
name = "inkwell-backend"
version = "0.1.0"
description = "Async FastAPI backend foundation for Inkwell"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.116,<1",
    "google-genai>=1.30,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pyjwt>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.16,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "--strict-markers --strict-config --cov=app --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "database: requires the isolated PostgreSQL test service",
    "vertex: requires live Vertex AI credentials and configuration",
]

[tool.coverage.run]
branch = true
omit = ["app/tests/*", "alembic/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".testenv", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
