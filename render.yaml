services:
  - type: web
    name: inkwell-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: uv sync --frozen && uv cache prune --ci
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: Inkwell API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: inkwell-postgres
          property: connectionString
      - key: DATABASE_ECHO
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: JWT_ISSUER
        value: inkwell-api
      - key: JWT_AUDIENCE
        value: inkwell-client
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL_ID
        value: deepseek/deepseek-v4-pro-0813
      - key: OPENROUTER_REQUEST_TIMEOUT_SECONDS
        value: "60"
      - key: OPENROUTER_MAX_OUTPUT_TOKENS
        value: "4096"
      - key: OPENROUTER_DATA_COLLECTION
        value: deny
      - key: OPENROUTER_ALLOW_FALLBACKS
        value: "true"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: inkwell-postgres
    region: frankfurt
    plan: free
